<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3SKRINO hero: Whiteout</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#hero-stage{position:fixed;inset:0;overflow:hidden}
.dc-root{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform-origin:center center}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0d0c0c;text-decoration:none}a:hover{color:#c21505}
</style>
<style>
.wo{container-type:inline-size;position:relative;width:100%;height:100%;overflow:hidden;background:#f7f7f5;color:#0d0c0c;font-family:'Archivo','Helvetica Neue',Arial,sans-serif}
.wo-nav{position:absolute;left:0;right:0;top:0;height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;z-index:5;font-size:15px}
.wo-logo{position:absolute;left:50%;top:128px;width:min(150cqw,880px);margin-left:calc(min(150cqw,880px) / -2);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.wo-photo{position:absolute;left:50%;top:140px;width:min(132cqw,660px);aspect-ratio:1;margin-left:calc(min(132cqw,660px) / -2);transition:transform .4s cubic-bezier(.2,.7,.2,1);-webkit-mask-image:linear-gradient(#000 62%,transparent 89%);mask-image:linear-gradient(#000 62%,transparent 89%)}
.wo-foot{position:absolute;left:0;right:0;bottom:0;padding:150px 20px 24px;display:flex;flex-direction:column;gap:14px}
.wo-foot a{display:flex;align-items:center;gap:10px;height:48px;padding:0 20px;box-sizing:border-box;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div id="hero-stage"></div>
<template id="dc-template">
<div onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="width: 1440px; height: 810px; position: relative; overflow: hidden; box-sizing: border-box; background: #f7f7f5; color: #0d0c0c; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 60px; top: 74px; width: 1320px; height: 645px; transform: translate3d(calc(var(--mx, 0) * -20px), calc(var(--my, 0) * -9px), 0); transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1)">
<img src="../assets/logo-red.webp" alt="" style="width: 1320px; height: 645px; display: block">
</div>

<div style="position: absolute; left: 270px; top: 46px; width: 900px; height: 900px; transform: translate3d(calc(var(--mx, 0) * 12px), calc(var(--my, 0) * 6px), 0); transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1)">
<img src="../assets/abdo-natural.webp" alt="Abdo Ashraf, 3SKRINO, backlit in chrome wraparound sunglasses and a red puffer jacket and gold chains, in front of a red 3SKRINO logo" style="width: 900px; height: 900px; display: block">
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.06; background-image: radial-gradient(rgba(0,0,0,0.9) 0.7px, rgba(0,0,0,0) 1px); background-size: 3px 3px"></div>

<nav aria-label="Primary" style="position: absolute; left: 0; top: 0; width: 1440px; height: 80px; box-sizing: border-box; padding: 0 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
<a href="#top" style="justify-self: start; font-weight: 900; font-size: 18px; letter-spacing: 0.02em; padding: 12px 0">3SKRINO</a>
<div style="display: flex; gap: 34px; font-size: 15px; font-weight: 500">
<a href="#vertical" style="padding: 12px 0">Vertical cuts</a>
<a href="#horizontal" style="padding: 12px 0">Horizontal cuts</a>
<a href="#ai" style="padding: 12px 0">AI cuts</a>
<a href="#about" style="padding: 12px 0">About</a>
<a href="#contact" style="padding: 12px 0">Contact</a>
</div>
<span style="justify-self: end; font-size: 15px; color: #4a4744">Cairo {{clock}}</span>
</nav>

<div style="position: absolute; left: 48px; bottom: 44px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 700">Abdo Ashraf</span>
<span style="font-size: 15px; color: #4a4744">Cinematographer and editor. Open for 2026 projects.</span>
</div>

<div style="position: absolute; right: 48px; bottom: 44px; display: flex; align-items: center; gap: 12px">
<a href="#showreel" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px; background: #f7f7f5; border: 1.5px solid #0d0c0c; box-sizing: border-box; font-size: 15px; font-weight: 700">
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14"><path d="M3 1.5 L12 7 L3 12.5 Z" fill="currentColor"></path></svg>
<span>Play showreel</span>
</a>
<a href="#work" style="display: flex; align-items: center; height: 52px; padding: 0 26px; background: #ff2b1c; color: #0d0c0c; font-size: 15px; font-weight: 700">View work</a>
</div>

</div>
</template>
<template id="dc-template-portrait">
<div class="wo" onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}">
<div aria-hidden="true" class="wo-logo" style="transform: translate3d(calc(var(--mx, 0) * -16px), calc(var(--my, 0) * -8px), 0)"><img src="../assets/logo-red.webp" alt="" style="width: 100%; display: block"></div>
<div class="wo-photo" style="transform: translate3d(calc(var(--mx, 0) * 10px), calc(var(--my, 0) * 5px), 0)"><img src="../assets/abdo-natural.webp" alt="Abdo Ashraf, 3SKRINO, backlit in chrome wraparound sunglasses and a red puffer jacket and gold chains, in front of a red 3SKRINO logo" style="width: 100%; height: 100%; display: block"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.06; background-image: radial-gradient(rgba(0,0,0,0.9) 0.7px, rgba(0,0,0,0) 1px); background-size: 3px 3px"></div>
<nav aria-label="Primary" class="wo-nav"><a href="#top" style="font-weight: 900; font-size: 18px; letter-spacing: 0.02em; padding: 10px 0">3SKRINO</a><span style="color: #4a4744">Cairo {{clock}}</span></nav>
<div class="wo-foot">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; font-weight: 700">Abdo Ashraf</span><span style="font-size: 15px; color: #4a4744">Cinematographer and editor. Open for 2026 projects.</span></div>
<div style="display: flex; gap: 10px"><a href="#showreel" style="background: #f7f7f5; border: 1.5px solid #0d0c0c"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14"><path d="M3 1.5 L12 7 L3 12.5 Z" fill="currentColor"></path></svg><span>Play showreel</span></a><a href="#work" style="background: #ff2b1c; color: #0d0c0c; padding: 0 24px">View work</a></div>
</div>
</div>
</template>
<script src="../runtime/dc-lite.js"></script>
<script>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => this.setState({ tick: Date.now() }), 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const motion = this.props.motion ?? true;
let clock = '00:00';
try {
clock = new Date().toLocaleTimeString('en-GB', { timeZone: 'Africa/Cairo', hour: '2-digit', minute: '2-digit', hour12: false });
} catch (e) {}
return {
clock: clock,
onMove: (e) => {
if (!motion) return;
const el = e.currentTarget;
const r = el.getBoundingClientRect();
el.style.setProperty('--mx', (((e.clientX - r.left) / r.width) * 2 - 1).toFixed(3));
el.style.setProperty('--my', (((e.clientY - r.top) / r.height) * 2 - 1).toFixed(3));
},
onLeave: (e) => {
e.currentTarget.style.setProperty('--mx', '0');
e.currentTarget.style.setProperty('--my', '0');
}
};
}
}
DCLite.mount(Component, document.getElementById('dc-template'), document.getElementById('hero-stage'), {"motion": true});
</script>
</body>
</html>
