<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3SKRINO hero: Depth</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#hero-stage{position:fixed;inset:0;overflow:hidden}
.dc-root{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform-origin:center center}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111;text-decoration:none}a:hover{color:#e2372b}
.sc{transition:transform 200ms cubic-bezier(0.16,1,0.3,1)}
</style>
<style>
/* portrait (phones, upright tablets): canvas 844 tall, 390-640 wide; see runtime */
.pt{container-type:inline-size;position:relative;width:100%;height:100%;overflow:hidden;background:#e9e4da;color:#111;font-family:'Familjen Grotesk',sans-serif;display:flex;flex-direction:column}
.pt-nav{position:absolute;left:0;right:0;top:0;height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;z-index:5;font-size:15px;font-weight:500}
.pt-copy{position:relative;z-index:4;padding:88px 24px 0;display:flex;flex-direction:column;gap:16px}
.pt-copy h1{margin:0;font-size:clamp(56px,15.5cqw,76px);line-height:.88;font-weight:700;letter-spacing:-.045em;max-width:9ch}
.pt-copy p{margin:0;font-size:16px;line-height:1.45;max-width:34ch}
.pt-cta{display:flex;gap:10px;flex-wrap:wrap}
.pt-cta a{display:flex;align-items:center;gap:10px;height:48px;padding:0 20px;box-sizing:border-box;font-size:15px;font-weight:700}
.pt-stage{position:relative;flex:1;min-height:0;container-type:size;perspective:1400px}
.pt-tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(calc(var(--mx,0) * 9deg)) rotateX(calc(var(--my,0) * -7deg))}
.pt-layer{position:absolute;inset:0}
.pt-box{position:absolute;bottom:-3%;left:50%;width:min(100cqh,118cqw);aspect-ratio:1;transform:translateX(-50%)}
.pt-box img{position:absolute;inset:0;width:100%;height:100%}
.pt-logo{position:absolute;left:50%;top:6%;width:128cqw;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="hero-stage"></div>
<template id="dc-template">
<div onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="width: 1440px; height: 810px; position: relative; overflow: hidden; box-sizing: border-box; background: #e9e4da; color: #111111; font-family: 'Familjen Grotesk', sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; perspective: 1400px; perspective-origin: 720px 405px">
<div class="sc" style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-style: preserve-3d; transform-origin: 720px 405px; transform: rotateY(calc(var(--mx, 0) * 9deg)) rotateX(calc(var(--my, 0) * -7deg))">
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 720px 405px; transform: translateZ(-300px) scale(1.2143); "><img src="../assets/logo-red.webp" alt="3SKRINO logo" style="position: absolute; left: 420px; top: 160px; width: 940px"></div>
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 720px 405px; transform: translateZ(0px) scale(1.0000); "><img src="../assets/abdo-clean-plate.webp" alt="Abdo Ashraf, 3SKRINO, in chrome wraparound sunglasses, a red puffer jacket and gold chains" style="position: absolute; left: 560px; top: 30px; width: 780px; height: 780px; "></div>
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 720px 405px; transform: translateZ(110px) scale(0.9214); "><img src="../assets/abdo-chains.webp" alt="" style="position: absolute; left: 560px; top: 30px; width: 780px; height: 780px; filter: drop-shadow(0 14px 12px rgba(0,0,0,0.35))"></div>
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 720px 405px; transform: translateZ(170px) scale(0.8786); scale: 1.02"><img src="../assets/abdo-glasses.webp" alt="" style="position: absolute; left: 764.8px; top: 303.0px; width: 370.5px; height: 156.0px; filter: drop-shadow(0 12px 10px rgba(0,0,0,0.5))"></div>
</div></div><nav aria-label="Primary" style="position: absolute; left: 0; top: 0; width: 1440px; height: 80px; box-sizing: border-box; padding: 0 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 5">
<a href="#top" style="justify-self: start; padding: 12px 0; font-weight: 800; font-size: 19px">3SKRINO</a>
<div style="display: flex; gap: 32px; font-size: 15px; font-weight: 500">
<a href="#vertical" style="padding: 12px 0">Vertical cuts</a>
<a href="#horizontal" style="padding: 12px 0">Horizontal cuts</a>
<a href="#ai" style="padding: 12px 0">AI cuts</a>
<a href="#about" style="padding: 12px 0">About</a>
<a href="#contact" style="padding: 12px 0">Contact</a>
</div>
<div style="justify-self: end"></div>
</nav>
<div style="position: absolute; left: 80px; top: 200px; width: 470px; display: flex; flex-direction: column; gap: 22px">
<h1 style="margin: 0; font-size: 96px; line-height: 0.88; font-weight: 700; letter-spacing: -0.045em">Depth of field: me.</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.5; max-width: 420px">Move around. The shades come out of the screen first, then the chains. The logo stays in the back where it belongs.</p>
<div style="display: flex; gap: 12px"><a href="#showreel" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 22px; border: 2px solid #111111; box-sizing: border-box; font-size: 16px; font-weight: 700"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14"><path d="M3 1.5 L12 7 L3 12.5 Z" fill="currentColor"></path></svg><span>Play showreel</span></a><a href="#contact" style="display: flex; align-items: center; height: 54px; padding: 0 28px; background: #e2372b; color: #ffffff; font-size: 16px; font-weight: 800">Hire me</a></div>
</div>
</div>
</template>
<template id="dc-template-portrait">
<div class="pt" onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}">
<nav aria-label="Primary" class="pt-nav"><a href="#top" style="font-weight: 800; font-size: 18px; padding: 10px 0">3SKRINO</a><a href="#contact" style="padding: 10px 0">Contact</a></nav>
<div class="pt-copy">
<h1>Depth of field: me.</h1>
<p>Move around. The shades come out of the screen first, then the chains. The logo stays in the back where it belongs.</p>
<div class="pt-cta"><a href="#showreel" style="border: 2px solid #111111"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14"><path d="M3 1.5 L12 7 L3 12.5 Z" fill="currentColor"></path></svg><span>Play showreel</span></a><a href="#contact" style="background: #e2372b; color: #ffffff; font-weight: 800; padding: 0 26px">Hire me</a></div>
</div>
<div class="pt-stage"><div class="pt-tilt sc">
<div class="pt-layer" style="transform: translateZ(-300px) scale(1.2143)"><img class="pt-logo" src="../assets/logo-red.webp" alt="3SKRINO logo"></div>
<div class="pt-layer"><div class="pt-box"><img src="../assets/abdo-clean-plate.webp" alt="Abdo Ashraf, 3SKRINO, in chrome wraparound sunglasses, a red puffer jacket and gold chains"></div></div>
<div class="pt-layer" style="transform: translateZ(110px) scale(0.9214)"><div class="pt-box"><img src="../assets/abdo-chains.webp" alt="" style="filter: drop-shadow(0 14px 12px rgba(0,0,0,0.35))"></div></div>
<div class="pt-layer" style="transform: translateZ(170px) scale(0.8786)"><div class="pt-box"><img src="../assets/abdo-glasses.webp" alt="" style="inset: auto; left: 26.26%; top: 35%; width: 47.5%; height: 20%; filter: drop-shadow(0 12px 10px rgba(0,0,0,0.5))"></div></div>
</div></div>
</div>
</template>
<script src="../runtime/dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};

return {

onMove: (e) => {
const el=e.currentTarget;const r=el.getBoundingClientRect();const fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),fy=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));el.style.setProperty('--mx',(fx*2-1).toFixed(3));el.style.setProperty('--my',(fy*2-1).toFixed(3));el.style.setProperty('--px',(fx*1440).toFixed(0)+'px');el.style.setProperty('--py',(fy*810).toFixed(0)+'px');

},
onLeave: (e) => {
const el=e.currentTarget;el.style.setProperty('--mx','0');el.style.setProperty('--my','0');

}
};
}
}
DCLite.mount(Component, document.getElementById('dc-template'), document.getElementById('hero-stage'), {});
</script>
</body>
</html>
