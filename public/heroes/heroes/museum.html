<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3SKRINO hero: Museum</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#hero-stage{position:fixed;inset:0;overflow:hidden}
.dc-root{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform-origin:center center}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2a2622;text-decoration:none}a:hover{color:#8c1c13}
.laser,.alarmglow{transition:opacity 200ms ease-out}
@keyframes strobe{0%,49%{opacity:1}50%,100%{opacity:0.25}}
.on .strobe{animation:strobe 600ms steps(1) infinite}
@media (prefers-reduced-motion: reduce){.on .strobe{animation:none}}
</style>
</head>
<body>
<div id="hero-stage"></div>
<template id="dc-template">
<div class="{{cls}}" onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" style="width: 1440px; height: 810px; position: relative; overflow: hidden; box-sizing: border-box; background: #cfc9bf; color: #2a2622; font-family: 'Jost', sans-serif">
<img src="../assets/gallery-wall.jpg" alt="" style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 640px; background: radial-gradient(ellipse 420px 420px at 720px 330px, rgba(255,246,228,0.55), rgba(255,246,228,0) 70%), radial-gradient(ellipse 900px 520px at 720px 300px, rgba(255,240,220,0.18), rgba(0,0,0,0) 70%), linear-gradient(rgba(0,0,0,0.12), rgba(0,0,0,0) 30%, rgba(0,0,0,0.14))"></div>
<div aria-hidden="true" style="position: absolute; left: 520px; top: 0; width: 400px; height: 120px; background: linear-gradient(rgba(255,248,232,0.18), rgba(255,248,232,0)); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%)"></div>
<div aria-hidden="true" style="position: absolute; left: 690px; top: 0; width: 60px; height: 26px; background: linear-gradient(#3a3734, #1d1b19); border-radius: 0 0 10px 10px; box-shadow: 0 6px 12px rgba(0,0,0,0.3)"><span style="position: absolute; left: 14px; bottom: -4px; width: 32px; height: 8px; border-radius: 50%; background: #fff6e0; box-shadow: 0 0 18px 6px rgba(255,246,224,0.7)"></span></div>
<div style="position: absolute; left: 520px; top: 100px; width: 400px; height: 500px; filter: drop-shadow(0 26px 22px rgba(40,30,20,0.38)) drop-shadow(0 4px 4px rgba(40,30,20,0.3))">
<div style="position: absolute; left: 60px; top: 60px; width: 280px; height: 380px; overflow: hidden; background: #1b120c">
<img src="../assets/abdo-natural.webp" alt="Abdo Ashraf, 3SKRINO, in chrome wraparound sunglasses, a red puffer jacket and gold chains" style="position: absolute; left: -125px; top: -40px; width: 530px; height: 530px; filter: contrast(1.05) saturate(0.92)">
<div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, rgba(0,0,0,0) 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0 1px, rgba(0,0,0,0) 1px 3px); mix-blend-mode: overlay"></div>
<div style="position: absolute; inset: 0; background: linear-gradient(125deg, rgba(255,255,255,0.16) 0 18%, rgba(255,255,255,0) 32%), radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0), rgba(0,0,0,0.35) 90%)"></div>
<div style="position: absolute; inset: 0; box-shadow: inset 0 6px 10px rgba(0,0,0,0.55), inset 0 -2px 4px rgba(0,0,0,0.3)"></div>
</div>
<img src="../assets/gold-frame.webp" alt="" style="position: absolute; left: 0; top: 0; width: 400px; height: 500px">
<div class="laser" aria-hidden="true" style="position: absolute; left: -40px; top: -20px; width: 480px; height: 540px; opacity: {{laser}}; background: repeating-linear-gradient(28deg, rgba(255,0,0,0) 0 38px, rgba(255,40,30,0.9) 38px 40px, rgba(255,0,0,0) 40px 78px), repeating-linear-gradient(-28deg, rgba(255,0,0,0) 0 38px, rgba(255,40,30,0.9) 38px 40px, rgba(255,0,0,0) 40px 78px); filter: drop-shadow(0 0 4px #ff2a1a); pointer-events: none"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 520px; top: 642px; width: 400px; height: 160px; overflow: hidden; opacity: 0.22; filter: blur(2px); -webkit-mask-image: linear-gradient(#000, rgba(0,0,0,0) 70%); mask-image: linear-gradient(#000, rgba(0,0,0,0) 70%)">
<div style="position: absolute; left: 0; top: 0; width: 400px; height: 500px; transform: scaleY(-1); transform-origin: 50% 0"><img src="../assets/gold-frame.webp" alt="" style="position: absolute; left: 0; top: -500px; width: 400px; height: 500px"></div></div>
<div style="position: absolute; left: 980px; top: 360px; width: 200px; padding: 14px 16px; box-sizing: border-box; background: #f7f5f0; box-shadow: 0 3px 6px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.05)">
<div style="font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 19px; line-height: 1.1">3SKRINO</div>
<div style="font-size: 11px; line-height: 1.45; margin-top: 4px; color: #4a453f">Self-portrait with chains, 2026<br>Puffer, chrome, attitude<br>On loan from Cairo<br>Not for sale. Available for hire.</div></div>
<svg aria-hidden="true" width="1440" height="810" style="position: absolute; left: 0; top: 0; pointer-events: none">
<defs><linearGradient id="br" x1="0" x2="1"><stop offset="0" stop-color="#6b4b12"></stop><stop offset="0.35" stop-color="#f3d07a"></stop><stop offset="0.55" stop-color="#b8862b"></stop><stop offset="1" stop-color="#5a3d0c"></stop></linearGradient>
<linearGradient id="rp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3192a"></stop><stop offset="0.5" stop-color="#6d0c17"></stop><stop offset="1" stop-color="#3b0509"></stop></linearGradient></defs>
<ellipse cx="480" cy="768" rx="40" ry="9" fill="rgba(0,0,0,0.3)"></ellipse><ellipse cx="960" cy="768" rx="40" ry="9" fill="rgba(0,0,0,0.3)"></ellipse>
<ellipse cx="480" cy="760" rx="34" ry="8" fill="url(#br)"></ellipse><ellipse cx="960" cy="760" rx="34" ry="8" fill="url(#br)"></ellipse>
<rect x="473" y="560" width="14" height="200" fill="url(#br)"></rect><rect x="953" y="560" width="14" height="200" fill="url(#br)"></rect>
<circle cx="480" cy="556" r="12" fill="url(#br)"></circle><circle cx="960" cy="556" r="12" fill="url(#br)"></circle>
<path d="M486 566 Q720 670 954 566" fill="none" stroke="url(#rp)" stroke-width="16" stroke-linecap="round"></path>
<path d="M486 562 Q720 664 954 562" fill="none" stroke="rgba(255,140,150,0.35)" stroke-width="3" stroke-linecap="round"></path>
</svg>
<div class="strobe" aria-hidden="true" style="position: absolute; left: 1290px; top: 110px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, {{lampHi}}, {{lamp}}); box-shadow: 0 0 {{glow}}px {{lamp}}, 0 2px 0 #222"></div>
<div class="alarmglow" aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse 600px 400px at 1307px 127px, rgba(255,30,20,0.25), rgba(255,30,20,0) 70%); opacity: {{laser}}; pointer-events: none"></div>
<nav aria-label="Primary" style="position: absolute; left: 0; top: 0; width: 1440px; height: 80px; box-sizing: border-box; padding: 0 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 5">
<a href="#top" style="justify-self: start; padding: 12px 0; font-weight: 800; font-size: 19px">3SKRINO</a>
<div style="display: flex; gap: 32px; font-size: 15px; font-weight: 500">
<a href="#vertical" style="padding: 12px 0">Vertical cuts</a>
<a href="#horizontal" style="padding: 12px 0">Horizontal cuts</a>
<a href="#ai" style="padding: 12px 0">AI cuts</a>
<a href="#about" style="padding: 12px 0">About</a>
<a href="#contact" style="padding: 12px 0">Contact</a>
</div>
<div style="justify-self: end"></div>
</nav>
<div style="position: absolute; left: 80px; top: 170px; width: 380px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 72px; line-height: 0.95; font-weight: 600; color: #2a2622">Please do not touch the artist.</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #4a453f">{{msg}}</p>
<div style="display: flex; gap: 12px"><a href="#showreel" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 22px; border: 2px solid #2a2622; box-sizing: border-box; font-size: 16px; font-weight: 700"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14"><path d="M3 1.5 L12 7 L3 12.5 Z" fill="currentColor"></path></svg><span>Play showreel</span></a><a href="#contact" style="display: flex; align-items: center; height: 54px; padding: 0 28px; background: #2a2622; color: #f7f5f0; font-size: 16px; font-weight: 800">Hire me</a></div>
</div>
</div>
</template>
<script src="../runtime/dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const near = !!s.near;
return {
cls: near ? 'on' : '', laser: near ? 1 : 0, lamp: near ? '#ff2b1c' : '#5a1410', lampHi: near ? '#ffb0a8' : '#8a3a30', glow: near ? 50 : 0, msg: near ? 'Lasers armed. Security has been notified. Security is also a fan.' : 'The most visited piece in the building. Step closer to the frame. Go on.',
onMove: (e) => {
const el=e.currentTarget;const r=el.getBoundingClientRect();const fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),fy=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));el.style.setProperty('--mx',(fx*2-1).toFixed(3));el.style.setProperty('--my',(fy*2-1).toFixed(3));el.style.setProperty('--px',(fx*1440).toFixed(0)+'px');el.style.setProperty('--py',(fy*810).toFixed(0)+'px');
const dx = fx*1440 - 720, dy = fy*810 - 350; const n = Math.abs(dx) < 260 && Math.abs(dy) < 300; if (n !== !!(this.state && this.state.near)) this.setState({ near: n });
},
onLeave: (e) => {
const el=e.currentTarget;el.style.setProperty('--mx','0');el.style.setProperty('--my','0');
this.setState({ near: false });
}
};
}
}
DCLite.mount(Component, document.getElementById('dc-template'), document.getElementById('hero-stage'), {});
</script>
</body>
</html>
